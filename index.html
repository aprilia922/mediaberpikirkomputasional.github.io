const walls=[[1,4],[1,3],[3,2],[3,1]];function algorithm(){program=[];robot={x:0,y:4,d:0};running=false;runId++;renderAlgorithm()}function renderAlgorithm(){frame('Antar robot ke bendera',`<p>Robot mulai menghadap <b>atas</b>. Susun instruksi. Hindari tembok biru dan capai bendera di kanan atas.</p><div class="grid" id="robotGrid"></div><div class="code" id="code"></div><div class="actions"><button onclick="addCode('M')">↑ Maju</button><button onclick="addCode('L')">↶ Kiri</button><button onclick="addCode('R')">↷ Kanan</button><button onclick="if(!running){program.pop();updateCode()}">Hapus akhir</button></div><div class="actions"><button class="primary" id="run" onclick="runRobot()">Jalankan robot</button><button onclick="algorithm()">Ulangi</button></div>`);drawGrid();updateCode()}function drawGrid(){if(!$('robotGrid'))return;$('robotGrid').innerHTML=Array.from({length:25},(_,i)=>{let x=i%5,y=Math.floor(i/5),wall=walls.some(w=>w[0]===x&&w[1]===y);return `<div class="cell ${wall?'wall':''}">${robot.x===x&&robot.y===y?['⬆','➡','⬇','⬅'][robot.d]:x===4&&y===0?'⚑':wall?'':x===0&&y===4?'S':''}</div>`}).join('')}function addCode(c){if(running)return;if(program.length>=28){feedback('Maksimal 28 instruksi. Hapus langkah yang tidak diperlukan.');return}program.push(c);updateCode()}function updateCode(){if($('code'))$('code').innerHTML=program.length?program.map((c,i)=>`<span class="token">${i+1}. ${{M:'Maju',L:'Kiri',R:'Kanan'}[c]}</span>`).join(''):'Instruksi robot akan muncul di sini.'}async function runRobot(){if(running||!program.length)return;running=true;const id=++runId,commands=[...program];robot={x:0,y:4,d:0};let error=false;for(let c of commands){await new Promise(r=>setTimeout(r,330));if(id!==runId||!$('robotGrid')){running=false;return}if(c==='L')robot.d=(robot.d+3)%4;else if(c==='R')robot.d=(robot.d+1)%4;else{let x=robot.x+[0,1,0,-1][robot.d],y=robot.y+[-1,0,1,0][robot.d];if(x<0||x>4||y<0||y>4||walls.some(w=>w[0]===x&&w[1]===y)){error=true;break}robot.x=x;robot renderAlgorithm=function(){visualRobot={...robot};frame('Ekspedisi Robo Algo',`<div class="robot-layout"><section><div class="board-heading"><b>Papan penjelajahan</b><span id="facing">Menghadap atas ↑</span></div><div class="robot-board"><div class="grid" id="robotGrid"></div><canvas id="robotCanvas" width="500" height="500" aria-label="Robot bergerak mengikuti instruksi di papan"></canvas></div><p class="hint">Mulai dari S. Capai bendera. Balok batu tidak bisa dilewati.</p></section><section class="program-panel"><span class="eyebrow">BENGKEL INSTRUKSI</span><h3>Rancang perjalanan robot</h3><p>Robot bergerak maju sesuai arah hadapnya. Kiri dan kanan hanya memutar arah.</p><div class="instruction-controls"><button onclick="addCode('M')"><b>↑</b>Maju</button><button onclick="addCode('L')"><b>↶</b>Kiri</button><button onclick="addCode('R')"><b>↷</b>Kanan</button></div><div class="code" id="code"></div><p id="stepReadout" class="hint">Susun langkah, lalu jalankan.</p><div class="actions"><button class="primary" id="run" onclick="runRobot()">▶ Jalankan</button><button onclick="if(!running){program.pop();updateCode()}">⌫ Hapus</button><button onclick="algorithm()">↺ Ulangi</button></div></section></div>`);drawGrid();updateCode()};
drawGrid=function(){if(!$('robotGrid'))return;$('robotGrid').innerHTML=Array.from({length:25},(_,i)=>{let x=i%5,y=Math.floor(i/5),wall=walls.some(w=>w[0]===x&&w[1]===y);return `<div class="cell ${wall?'wall':''} ${x===4&&y===0?'goal':''}">${x===4&&y===0?'<span class="goal-flag">⚑</span>':wall?'▰':x===0&&y===4?'<span class="start-mark">S</span>':''}</div>`}).join('');if($('facing'))$('facing').textContent='Menghadap '+['atas ↑','kanan →','bawah ↓','kiri ←'][robot.d]};
updateCode=function(){if($('code'))$('code').innerHTML=program.length?program.map((c,i)=>`<span class="command-chip" data-step="${i}"><small>${i+1}</small><b>${{M:'↑',L:'↶',R:'↷'}[c]}</b>${{M:'Maju',L:'Kiri',R:'Kanan'}[c]}</span>`).join(''):'<span class="empty-code">Ketuk Maju, Kiri, atau Kanan untuk menambah langkah.</span>'};
runRobot=async function(){if(running||!program.length)return;running=true;let id=++runId,commands=[...program];robot={x:0,y:4,d:0};visualRobot={...robot};drawGrid();if($('run'))$('run').disabled=true;let error=false;for(let i=0;i<commands.length;i++){if(id!==runId||!$('robotCanvas')||!$('modal').classList.contains('show')){running=false;return}document.querySelectorAll('.command-chip').forEach((el,j)=>el.classList.toggle('executing',j===i));$('stepReadout').textContent=`Langkah ${i+1}/${commands.length} · ${{M:'Maju satu petak',L:'Putar ke kiri',R:'Putar ke kanan'}[commands[i]]}`;let c=commands[i];if(c==='L')robot.d=(robot.d+3)%4;else if(c==='R')robot.d=(robot.d+1)%4;else{let x=robot.x+[0,1,0,-1][robot.d],y=robot.y+[-1,0,1,0][robot.d];if(x<0||x>4||y<0||y>4||walls.some(w=>w[0]===x&&w[1]===y)){error=true;break}robot.x=x;robot.y=y}drawGrid();await new Promise(r=>setTimeout(r,650))}if(id!==runId)return;running=false;if($('run'))$('run').disabled=false;if(!error&&robot.x===4&&robot.y===0){feedback('Sampai! Instruksimu berhasil mengantar Robo Algo.');ping();await new Promise(r=>setTimeout(r,650));if(id===runId)complete(Math.max(60,100-attempt*10))}else if(taskMode===5){feedback('Robot belum sampai. Skor tugas ini 0.');$('feedback').insertAdjacentHTML('beforeend',' <button onclick="complete(0)">Lihat hasil asesmen</button>');if($('run'))$('run').disabled=true}else{attempt++;feedback(error?'Ups, jalurnya terhalang. Perhatikan posisi robot dan arah hadapnya, lalu perbaiki instruksi.':'Langkahnya habis, tetapi robot belum sampai. Tambahkan instruksi menuju bendera.')}};
function paintRobotBoard(){let c=$('robotCanvas');if(!c||!$('modal').classList.contains('show'))return;let cx=c.getContext('2d');cx.clearRect(0,0,500,500);visualRobot.x+=(robot.x-visualRobot.x)*.17;visualRobot.y+=(robot.y-visualRobot.y)*.17;robotArt(cx,50+visualRobot.x*100,50+visualRobot.y*100,62,robot.d,tick)}
const previousDraw=draw;draw=function(){previousDraw();paintRobotBoard()};
// PATTERNS: color names always accompany the actual colored shape.
const flowerColors=['#e5737e','#e9c85f','#69aee0'];
function bloom(color,labelText,unknown=false){return `<span class="bloom-card">${unknown?'<span class="pattern-unknown">?</span>':`<canvas class="bloom-canvas" data-color="${color}" width="90" height="95"></canvas>`}<small>${labelText}</small></span>`}
function paintBlooms(){document.querySelectorAll('.bloom-canvas').forEach(el=>{let c=el.getContext('2d'),col=el.dataset.color;c.clearRect(0,0,90,95);rr(c,43,49,4,37,2,'#71a27b');ellipse(c,33,70,12,5,'#8bb685');for(let i=0;i<6;i++){let a=i*Math.PI/3;ellipse(c,45+Math.cos(a)*15,32+Math.sin(a)*15,12,12,col)}ellipse(c,45,32,9,9,'#fff2c8');ellipse(c,42,29,3,3,'#fff')})}
pattern=function(){const q=patterns[patternRound];let visual=patternRound===0?[0,1,2,0,1].map(i=>bloom(flowerColors[i],['Merah','Kuning','Biru'][i])).join('')+bloom('','Berikutnya',true):patternRound===1?[3,6,9,12].map(n=>`<span class="number-tile"><b>${n}</b><small>${Array.from({length:n},()=>'<i></i>').join('')}</small></span>`).join('')+'<span class="pattern-unknown">?</span>':['↑','↑','→','↑','↑','→','?'].map((a,i)=>`<span class="arrow-tile ${i===6?'unknown':''}">${a}<small>${a==='↑'?'Atas':a==='→'?'Kanan':'Lanjut?'}</small></span>`).join('');frame('Taman pola yang hidup',`<div class="round-header"><span>POLA ${patternRound+1} DARI 3</span><div>${[0,1,2].map(i=>`<i class="${i<=patternRound?'filled':''}"></i>`).join('')}</div><p>${q.q}</p><div class="pattern-garden">${visual}</div><p><b>Bagian mana yang melanjutkan pola?</b></p><div class="pattern-options">${q.o.map((o,i)=>`<button onclick="checkPattern(${i})">${patternRound===0?bloom(flowerColors[i],o):patternRound===1?`<b class="option-number">${o}</b>`:`<b class="option-number">${['↑','↓','→'][i]}</b><span>${o}</span>`}</button>`).join('')}</div>`);paintBlooms()};
let patternBusy=false;checkPattern=function(i){if(patternBusy)return;let q=patterns[patternRound];if(i===q.a){patternPoints++;feedback('Tepat! '+q.why);ping();patternBusy=true;setTimeout(()=>{patternBusy=false;if($('modal').classList.contains('show'))nextPattern()},850)}else if(taskMode===5){patternBusy=true;feedback('Jawaban dicatat. Lanjut ke pola berikutnya.');setTimeout(()=>{patternBusy=false;if($('modal').classList.contains('show'))nextPattern()},650)}else{attempt++;feedback('Coba amati lagi. '+q.why)}};
// DECOMPOSITION: move both assigned and unassigned cards without restarting.
renderDecomp=function(){const icons=['☷','♟','▱','♫','★','①'];frame(taskMode===5?'Pecah tugas pentas kelas':'Bengkel pentas kelas',`<div class="context-banner"><span>01</span><div><b>Satu acara, banyak pekerjaan</b><p>Pecah pentas kelas menjadi tiga bagian yang lebih mudah ditangani.</p></div></div><p class="hint">Tarik kartu pada kotak yang tepat. Kartu yang sudah ditempatkan bisa dipindahkan lagi.</p><div class="cards task-deck">${tasks.map((t,i)=>groups[i]===undefined?`<button draggable="true" ondragstart="chosen=${i}" onclick="selectTask(${i},this)"><span>${icons[i]}</span>${t}</button>`:'').join('')||'<p class="hint">Semua kartu sudah ditempatkan. Periksa atau pindahkan kartu untuk memperbaiki.</p>'}</div><div class="bins">${['Perencanaan','Perlengkapan','Penampilan'].map((t,j)=>`<div class="bin category-${j}" role="button" tabindex="0" onkeydown="if(event.key==='Enter'&&event.target===this)put(${j})" ondragover="event.preventDefault()" ondrop="event.preventDefault();event.stopPropagation();put(${j})" onclick="put(${j})"><div class="bin-heading"><span>${['☷','▱','★'][j]}</span><b>${t}</b></div><small>${['Atur siapa dan apa','Siapkan alat dan tempat','Siapkan penampilannya'][j]}</small>${tasks.map((s,i)=>groups[i]===j?`<button class="token" draggable="true" ondragstart="event.stopPropagation();chosen=${i}" onclick="event.stopPropagation();selectTask(${i},this)">${s}</button>`:'').join('')}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="checkDecomp()">✓ Periksa kelompok</button><button onclick="decomp()">↺ Mulai ulang</button></div>`)};
function selectTask(i,b){chosen=i;document.querySelectorAll('.task-deck button,.bin .token').forEach(el=>el.classList.remove('selected'));b.classList.add('selected');feedback('Kartu dipilih. Ketuk kelompok tempat kartu ini seharusnya berada.')}
// ABSTRACTION: show a route map and let students physically classify evidence.
let infoGroups={},infoChosen=null;
abstractTask=function(){infoGroups={};infoChosen=null;renderAbstract()};
function renderAbstract(){frame('Detektif informasi',`<div class="context-banner"><span>03</span><div><b>Mencari rute tercepat ke perpustakaan</b><p>Ambil informasi yang membantu tujuanmu. Sisihkan detail yang tidak diperlukan.</p></div></div><canvas id="routeMap" width="720" height="200" aria-label="Peta sekolah: jalur A 4 menit ditutup, jalur B 6 menit terbuka"></canvas><div class="cards task-deck">${infos.map((s,i)=>infoGroups[i]===undefined?`<button draggable="true" ondragstart="infoChosen=${i}" onclick="infoChosen=${i};document.querySelectorAll('.task-deck button').forEach(b=>b.classList.remove('selected'));this.classList.add('selected')">${s}</button>`:'').join('')}</div><div class="info-bins">${['Penting untuk rute','Tidak diperlukan untuk rute'].map((s,j)=>`<div class="bin" role="button" tabindex="0" onkeydown="if(event.key==='Enter'&&event.target===this)putInfo(${j})" ondragover="event.preventDefault()" ondrop="event.preventDefault();putInfo(${j})" onclick="putInfo(${j})"><b>${j===0?'◎':'○'} ${s}</b>${infos.map((s,i)=>infoGroups[i]===j?`<button class="token" onclick="event.stopPropagation();infoChosen=${i};this.classList.add('selected')" draggable="true" ondragstart="infoChosen=${i}">${s}</button>`:'').join('')}</div>`).join('')}</div><div class="actions"><button class="primary" onclick="checkAbstractVisual()">✓ Periksa informasi</button><button onclick="abstractTask()">↺ Susun ulang</button></div><p class="hint">Informasi penting bergantung pada tujuan. Untuk mengecat kelas, warna dinding justru bisa penting.</p>`);paintRouteMap()}
function putInfo(j){if(infoChosen===null)return;infoGroups[infoChosen]=j;infoChosen=null;renderAbstract()}
function checkAbstractVisual(){if(Object.keys(infoGroups).length!==6){feedback('Tempatkan keenam kartu terlebih dahulu.');return}selectedInfo=new Set(Object.keys(infoGroups).filter(k=>infoGroups[k]===0).map(Number));checkAbstract()}
function paintRouteMap(){let c=$('routeMap').getContext('2d');rr(c,0,0,720,200,20,'#e6efdd');c.lineCap='round';c.lineWidth=15;c.strokeStyle='#afcfb0';c.beginPath();c.moveTo(100,100);c.lineTo(200,43);c.lineTo(510,43);c.lineTo(625,100);c.stroke();c.strokeStyle='#f4d999';c.beginPath();c.moveTo(100,100);c.lineTo(225,160);c.lineTo(500,160);c.lineTo(625,100);c.stroke();for(let [x,n] of [[90,'KELAS'],[620,'PERPUSTAKAAN']]){rr(c,x-55,69,110,61,12,'#fffef6');label(c,n,x,105,13)}rr(c,287,23,152,41,9,'#fae1d7');label(c,'A · 4 menit · DITUTUP',363,48,13,'#a06051');label(c,'B · 6 menit · TERBUKA',362,167,13,'#65784e');for(let i=0;i<5;i++)ellipse(c,160+i*107,104,12,12,'#97bd8f')}

if(collision(p.x,p.y)){p.x=900;p.y=770;}hud();startScreen();requestAnimationFrame(loop);
